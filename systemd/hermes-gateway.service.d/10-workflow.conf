# Workflow overrides, layered on hermes's self-managed gateway unit.
#
# hermes rewrites the MAIN hermes-gateway.service on every boot/start/restart
# (refresh_systemd_unit_if_needed, gateway/run.py), so a full workflow unit gets
# clobbered. Workflow customizations therefore live in this drop-in: systemd
# merges *.conf here on top of the main unit, and hermes's self-heal does not
# touch the .d/ directory. bootstrap.sh copies this file into
# ~/.config/systemd/user/hermes-gateway.service.d/.
[Service]
# Point bundled-skills sync at the workflow's versioned skills tree so gateway
# startup does not rewrite the checkout.
Environment=HERMES_BUNDLED_SKILLS=%h/.hermes/skills
# Auto-approve unseen shell hooks so the service doesn't hang on a TTY prompt.
Environment=HERMES_ACCEPT_HOOKS=1
# Sidekick plugin ownership flags.
Environment=SIDEKICK_PUSH_OWNED_BY_PLUGIN=true
Environment=SIDEKICK_INFLIGHT_OWNED_BY_PLUGIN=true

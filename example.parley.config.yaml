# Parley deployment config — EXAMPLE / TEMPLATE
#
# Copy to `parley.config.yaml` and edit. See parley/example.config.yaml
# in the parley repo for the full schema + comments.
#
# Secrets (DEEPGRAM_API_KEY, GW_TOKEN, OPENROUTER_API_KEY, TAVILY_API_KEY,
# etc.) live in the parley.service systemd unit as Environment= entries
# — NOT in this file. TAVILY_API_KEY is optional; without it hermes's
# web_search / web_extract tools are no-ops. Free tier at https://tavily.com.

# ── Branding ──────────────────────────────────────────────────────────
app:
  name: <your-parley-name>          # e.g. "Parley"
  subtitle: <short-tagline>           # e.g. "Agent Portal"
  agent_label: <agent-display-name>   # what the UI calls the assistant
  theme_primary: ~                    # hex color or ~ for default

# ── Backend ───────────────────────────────────────────────────────────
backend:
  parley_platform:
    # Hermes platform-adapter (peer of telegram/slack/signal). The
    # adapter runs in-process inside hermes-agent on port 8645.
    # Auth token comes from $PARLEY_PLATFORM_TOKEN (systemd drop-in
    # or env). Parley reads only this key — the legacy backend.hermes
    # block (state_db / store_db / cli_path) is gone post-refactor.
    url: http://127.0.0.1:8645
    # Which hermes platforms surface in the drawer. `api_server` is parley
    # itself; add the chat platforms you want visible (telegram/whatsapp/
    # slack/signal/discord). Non-parley chats render with a source badge
    # and a read-only composer (parley can't send to those platforms yet).
    session_sources: [api_server, telegram, whatsapp, slack]

# ── Ambient weather (corner widget) ───────────────────────────────────
weather:
  lat: ~                              # e.g. 51.5074
  lon: ~                              # e.g. -0.1278

# ── Server ────────────────────────────────────────────────────────────
server:
  port: 3001
  host: ~
  disable_screenshot: false
  # Bootstrap prefers Tailscale Serve for trusted HTTPS:
  #   https://<host>.<tailnet>.ts.net:3001/ -> http://127.0.0.1:3001
  # Native Parley HTTPS is only an explicit non-Tailscale fallback:
  # PARLEY_ALLOW_SELF_SIGNED_FALLBACK=1 scripts/bootstrap.sh
  # Browsers will label self-signed certs "Not Secure" until trusted.
  https:
    cert_file: ~/.local/share/parley/tls/parley.crt
    key_file: ~/.local/share/parley/tls/parley.key

# ── STT keyterm biasing (managed via Settings → STT keyterms in UI) ──
# Add proper nouns, names, brands, jargon that Deepgram should bias toward.
stt:
  keyterms:
    - <your-name>
    - <agent-label>
    - <project-or-product-name>
    # add other proper nouns / jargon you say often
